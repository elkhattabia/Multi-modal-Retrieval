[project]
name = "multi-modal-retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elkhattabia", email = "elkhattabianas71@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "pypdfium2>=5.13.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[project.scripts]
multi-modal-retrieval = "multi_modal_retrieval:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
